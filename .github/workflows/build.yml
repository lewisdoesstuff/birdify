name: Build

on:
  push:
    branches: [ main ]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          # The action's default is "tools platform-tools", and the legacy tools
          # package has been withdrawn from the SDK repository, so asking for
          # our own list keeps that install from failing.
          packages: 'platforms;android-35 build-tools;35.0.0'

      - name: Build and package
        run: ./release.sh

      - name: Upload KernelSU module
        uses: actions/upload-artifact@v4
        with:
          name: birdify-ksu
          path: birdify-ksu.zip

      - name: Upload APKs
        uses: actions/upload-artifact@v4
        with:
          name: apks
          path: |
            app/build/outputs/apk/debug/app-debug.apk
            overlay/build/outputs/apk/debug/overlay-debug.apk

  guards:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: No hardcoded resource ids
        run: |
          if grep -rnE '0x7f[0-9a-f]{6}' app/src/main/java; then
            echo "::error::X renumbers every resource id on each release."
            echo "::error::Resolve resources by name instead."
            exit 1
          fi

      - name: No obfuscated classes
        run: |
          # Targets.kt finds every obfuscated member at runtime, so no source
          # names one. R8 gives renamed classes one- or two-letter names, so a
          # string or dex descriptor ending in such a segment is one of them.
          found=$(grep -rnE '"[a-z][a-z0-9_]*(\.[a-z0-9_]+)*\.[a-z][0-9a-z]?"|L[a-z0-9_]+(/[a-z0-9_]+)+/[a-z][0-9a-z]?;' \
            app/src/main/java || true)
          if [ -n "$found" ]; then
            echo "::error::R8 renames these on every X release."
            echo "::error::Find them in Targets.kt, by resource name, or through a stable API instead."
            echo "$found"
            exit 1
          fi
