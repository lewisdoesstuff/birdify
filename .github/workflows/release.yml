name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          # The action's default is "tools platform-tools", and the legacy tools
          # package has been withdrawn from the SDK repository, so asking for
          # our own list keeps that install from failing.
          packages: 'platforms;android-35 build-tools;35.0.0'

      - name: Build and package
        run: ./release.sh

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          files: birdify-ksu.zip
          generate_release_notes: true
